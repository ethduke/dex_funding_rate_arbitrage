BACKPACK_AUTH:
  DEFAULT_WINDOW: 5000

BACKPACK_API_URL: https://api.backpack.exchange/
BACKPACK_WS_URL: wss://ws.backpack.exchange/

HYPERLIQUID_API_URL: https://api.hyperliquid.xyz

LIGHTER_API_URL: https://mainnet.zklighter.elliot.ai/
LIGHTER_WS_URL: wss://mainnet.zklighter.elliot.ai/stream


LIGHTER_API_KEY_INDEX: 4
LIGHTER_ACCOUNT_INDEX: 5725
LIGHTER_SELF_TRADE_BEHAVIOR_MODE: 0
LIGHTER_SELF_TRADE_EQUALITY_MODE: 0

# Separate Robinhood Chain venue; opt in below after configuring its own account.
LIGHTER_RHC_API_URL: https://api.rh.lighter.xyz
LIGHTER_RHC_ACCOUNT_INDEX: null
LIGHTER_RHC_API_KEY_INDEX: 4
LIGHTER_RHC_MAX_SLIPPAGE: 0.01
LIGHTER_RHC_SELF_TRADE_BEHAVIOR_MODE: 0
LIGHTER_RHC_SELF_TRADE_EQUALITY_MODE: 0

LOG_FILE_PATH: logs/arbitrage.log

# Arbitrage Engine Configuration
POSITION_SIZE: 20.0
MIN_RATE_DIFFERENCE: 0.0001
MIN_HOLD_TIME_SECONDS: 3600
MAGNITUDE_REDUCTION_THRESHOLD: 0.1
CHECK_INTERVAL_MINUTES: 30
MAX_CONCURRENT_POSITIONS: 1

EXCHANGES:
  ENABLED:
    - Lighter
    - Hyperliquid
    - TradeXYZ
    # - LighterRHC
  COMPARISON_PAIRS:
    - [Lighter, Hyperliquid]
    - [Lighter, TradeXYZ]
    # - [Lighter, LighterRHC]
    # - [LighterRHC, TradeXYZ]
